<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkdownPreview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .content {
            padding: 48px 32px 32px 32px;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
            color: #1F2328;
            margin: 0;
        }
        .version {
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
            color: #656D76;
            margin-top: 8px;
        }
        .hint {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            color: #656D76;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>MarkdownPreview</h1>
        <div class="version">v0.1.0</div>
        <div class="hint">Open a .md file to see the preview</div>
    </div>
</body>
</html>
