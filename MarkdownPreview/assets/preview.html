<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkdownPreview</title>

    <!-- KaTeX math rendering styles (XRND-01) — must load before katex.min.js -->
    <link rel="stylesheet" href="https://appassets.mdpreview/katex.min.css">

    <!-- Base theme stylesheets — swapped by setTheme() -->
    <!-- Light theme is default; C++ sends initial theme on ready -->
    <link id="md-theme"   rel="stylesheet" href="https://appassets.mdpreview/github-markdown-light.css">
    <link id="hljs-theme" rel="stylesheet" href="https://appassets.mdpreview/hljs-github.min.css">

    <!-- Custom CSS placeholder — replaced by setCustomCss() or removed if no custom CSS -->
    <!-- Absent by default; injected as <style id="custom-css"> when C++ sends customCss -->

    <style>
        /* CSS custom properties — spacing scale per UI-SPEC */
        :root {
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        /* Light body background (github-markdown-css light = #ffffff) */
        body {
            background: #FFFFFF;
        }

        /* Dark body background applied when data-theme="dark" on body */
        body[data-theme="dark"] {
            background: #0D1117;
        }

        /* Content wrapper — matches github-markdown-css expected structure */
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: var(--space-xl);  /* 32px all sides per UI-SPEC */
        }

        /* Idle/welcome state — shown on load and when a non-.md file is active */
        #idle-state {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        #idle-state .content {
            padding: var(--space-2xl) var(--space-xl) var(--space-xl) var(--space-xl);
        }
        #idle-state h1 {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
            color: #1F2328;
            margin: 0;
        }
        body[data-theme="dark"] #idle-state h1 {
            color: #E6EDF3;
        }
        #idle-state .version {
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
            color: #656D76;
            margin-top: var(--space-sm);
        }
        #idle-state .hint {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            color: #656D76;
            margin-top: var(--space-lg);
        }

        /* Error state — shown when rendering fails */
        #error-state {
            display: none;
            padding: var(--space-xl);
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        #error-state h2 {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
            color: #CF222E;  /* Destructive light per UI-SPEC */
        }
        body[data-theme="dark"] #error-state h2 {
            color: #F85149;  /* Destructive dark per UI-SPEC */
        }
        #error-state p {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            color: #656D76;
            margin-top: var(--space-md);
        }
        #error-detail {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.4;
            color: #656D76;
            margin-top: var(--space-sm);
            font-family: monospace;
        }

        /* Copy-to-clipboard button (XRND-04, D-02, D-03) */
        /* Icon-only, top-right corner of each code block, visible on hover */
        /* No feedback animation per D-03 */
        pre {
            position: relative;
        }
        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            display: none;
            background: transparent;
            border: 1px solid #d1d9e0;
            border-radius: 6px;
            padding: 4px;
            cursor: pointer;
            color: #636c76;
            line-height: 0;
        }
        body[data-theme="dark"] .copy-btn {
            border-color: #3d444d;
            color: #9198a1;
        }
        pre:hover .copy-btn {
            display: block;
        }
        .copy-btn:hover {
            background: #f6f8fa;
            color: #1f2328;
        }
        body[data-theme="dark"] .copy-btn:hover {
            background: #2d333b;
            color: #e6edf3;
        }
    </style>

    <!-- JS libraries (loaded synchronously — no defer, order matters) -->
    <script src="https://appassets.mdpreview/markdown-it.min.js"></script>
    <script src="https://appassets.mdpreview/markdown-it-task-lists.min.js"></script>
    <script src="https://appassets.mdpreview/highlight.min.js"></script>
    <!-- KaTeX math engine + texmath markdown-it plugin (XRND-01) -->
    <!-- Use markdown-it-texmath (texmath.js) NOT @vscode/markdown-it-katex — the latter has no browser UMD build -->
    <script src="https://appassets.mdpreview/katex.min.js"></script>
    <script src="https://appassets.mdpreview/texmath.js"></script>
    <!-- Footnotes with numbering and back-references (XRND-03) -->
    <script src="https://appassets.mdpreview/markdown-it-footnote.min.js"></script>
    <!-- Mermaid diagram rendering (XRND-02) — IIFE bundle, self-contained, window.mermaid -->
    <script src="https://appassets.mdpreview/mermaid.min.js"></script>
</head>
<body>
    <!-- Idle/welcome state — visible on load; hidden once first render arrives -->
    <div id="idle-state">
        <div class="content">
            <h1>MarkdownPreview</h1>
            <div class="version">v0.1.0</div>
            <div class="hint">Open a .md file to see the preview</div>
        </div>
    </div>

    <!-- Primary preview area (hidden until first render) -->
    <div id="preview" class="markdown-body" style="display:none"></div>

    <!-- Error state (shown on render failure) -->
    <div id="error-state">
        <h2>Preview unavailable</h2>
        <p>An error occurred while rendering this document. Check your Markdown syntax and try again.</p>
        <div id="error-detail"></div>
    </div>

    <script>
    // =========================================================================
    // markdown-it initialization
    // =========================================================================
    // Default preset enables: tables, strikethrough, linkify (GFM-compatible)
    // html: false — do not pass raw HTML through (security — ASVS L1, T-02-06)
    // linkify: true — auto-detect URLs (REND-03)
    var md = window.markdownit({
        html: false,
        linkify: true,
        typographer: false
    });

    // Apply markdown-it-task-lists plugin (REND-03 GFM task lists)
    // The UMD global is window.markdownitTaskLists (verified from downloaded file header)
    if (window.markdownitTaskLists) {
        md.use(window.markdownitTaskLists, { enabled: true });
    }

    // Apply markdown-it-footnote plugin (XRND-03)
    // UMD global is window.markdownitFootnote (verified from dist/markdown-it-footnote.min.js UMD wrapper)
    if (window.markdownitFootnote) {
        md.use(window.markdownitFootnote);
    }

    // Apply markdown-it-texmath plugin for KaTeX math rendering (XRND-01)
    // texmath.js exposes window.texmath; KaTeX engine is window.katex
    // throwOnError: false — malformed math renders inline red error span instead of crashing render (Pitfall 3)
    // delimiters: 'dollars' — handles $...$ inline and $$...$$ block (per CONTEXT.md XRND-01)
    if (window.texmath && window.katex) {
        md.use(window.texmath, {
            engine: window.katex,
            delimiters: 'dollars',
            katexOptions: { throwOnError: false }
        });
    }

    // =========================================================================
    // Mermaid initialization (XRND-02)
    // startOnLoad: false — we call mermaid.run() manually after each render
    // theme set here; updated in setTheme() when dark/light mode changes
    // Pitfall 1 mitigation: use window.mermaid || window.mermaid?.default guard
    // =========================================================================
    var _mermaid = (window.mermaid && typeof window.mermaid.initialize === 'function')
        ? window.mermaid
        : (window.mermaid && window.mermaid.default
            && typeof window.mermaid.default.initialize === 'function'
            ? window.mermaid.default : null);

    if (_mermaid) {
        _mermaid.initialize({ startOnLoad: false, theme: 'default' });
    }

    // =========================================================================
    // Source map: inject data-line="N" on block-level tokens (D-04)
    // Used by scroll sync in Plan 02-03
    // token.map is [lineStart, lineEnd] — 0-indexed, matching Scintilla
    // =========================================================================
    md.core.ruler.push('source_map', function(state) {
        for (var i = 0; i < state.tokens.length; i++) {
            var token = state.tokens[i];
            if (token.map && token.map.length >= 2 && !token.type.endsWith('_close')) {
                token.attrSet('data-line', String(token.map[0]));
            }
        }
    });

    // =========================================================================
    // YAML frontmatter strip (D-03, REND-06)
    // Strips content between leading --- delimiters before parse
    // =========================================================================
    function stripFrontmatter(markdown) {
        // Strip UTF-8 BOM (U+FEFF) if present — Scintilla returns raw bytes including BOM.
        // Without this, files with BOM skip frontmatter detection entirely.
        if (markdown.charCodeAt(0) === 0xFEFF) {
            markdown = markdown.slice(1);
        }
        if (markdown.startsWith('---')) {
            // Match both \n--- and \r\n--- as the closing delimiter (WR-05).
            var end = markdown.search(/\r?\n---(\r?\n|$)/);
            if (end !== -1) {
                // Advance past the matched \n--- (plus optional trailing \r\n)
                var afterDelim = markdown.indexOf('\n', end + 1) + 1;
                return markdown.slice(afterDelim).trimStart();
            }
        }
        return markdown;
    }

    // =========================================================================
    // Theme management (D-05, D-06, THME-01, THME-03)
    // Swaps both the github-markdown and highlight.js CSS links as a pair
    // Does NOT use prefers-color-scheme — NPP controls theme, not OS
    // =========================================================================
    function setTheme(isDark) {
        var mdTheme   = document.getElementById('md-theme');
        var hljsTheme = document.getElementById('hljs-theme');
        if (isDark) {
            mdTheme.href   = 'https://appassets.mdpreview/github-markdown-dark.css';
            hljsTheme.href = 'https://appassets.mdpreview/hljs-github-dark.min.css';
            document.body.setAttribute('data-theme', 'dark');
        } else {
            mdTheme.href   = 'https://appassets.mdpreview/github-markdown-light.css';
            hljsTheme.href = 'https://appassets.mdpreview/hljs-github.min.css';
            document.body.removeAttribute('data-theme');
        }

        // Update Mermaid theme when dark/light mode changes (XRND-02)
        // Mermaid 11 requires re-initialization with new theme before next mermaid.run() call
        if (_mermaid) {
            _mermaid.initialize({
                startOnLoad: false,
                theme: isDark ? 'dark' : 'default'
            });
            // Diagrams will re-render on the next 'render' message from C++
            // (theme change always triggers a full re-render in Phase 2 flow)
        }
    }

    // =========================================================================
    // Custom CSS injection (D-07, THME-02)
    // C++ reads custom.css content and sends it in the render message as customCss field
    // Injected as inline <style> after base theme (cascade: github-markdown -> hljs -> custom)
    // =========================================================================
    function setCustomCss(cssText) {
        var existing = document.getElementById('custom-css');
        if (cssText && cssText.trim().length > 0) {
            if (!existing) {
                existing = document.createElement('style');
                existing.id = 'custom-css';
                document.head.appendChild(existing);
            }
            existing.textContent = cssText;
        } else {
            if (existing) existing.remove();
        }
    }

    // =========================================================================
    // Image path rewrite (D-08, REND-05) — Plan 02-03
    // Rewrites relative image paths to use file.mdpreview virtual host.
    // Handles: ./img.png, subdir/img.png, ../img.png
    // Leaves unchanged: http://, https://, //, and data: URIs
    // T-02-11 mitigation: only rewrites markdown image syntax; DENY_CORS on virtual host
    // =========================================================================
    function rewriteImagePaths(markdownText) {
        return markdownText.replace(
            /!\[([^\]]*)\]\((?!https?:\/\/|\/\/|data:)(\.?\.?\/?)([^)\s][^)]*(?:\([^)]*\)[^)]*)*)\)/g,
            function(match, alt, prefix, rest) {
                // Normalize: strip leading ./ if present
                var normalized = (prefix + rest).replace(/^\.\//, '');
                return '![' + alt + '](https://file.mdpreview/' + normalized + ')';
            }
        );
    }

    // =========================================================================
    // Idle state helpers — show/hide the welcome screen
    // =========================================================================
    function showIdle() {
        document.getElementById('idle-state').style.display = 'flex';
        document.getElementById('preview').style.display    = 'none';
        document.getElementById('error-state').style.display = 'none';
    }

    function hideIdle() {
        document.getElementById('idle-state').style.display = 'none';
    }

    // =========================================================================
    // Mermaid diagram rendering (XRND-02, D-01)
    // Called after hljs.highlightAll() in renderMarkdown().
    // hljs processes all code blocks including mermaid ones. We must:
    //   1. Find code elements with class "language-mermaid"
    //   2. Extract raw source (pre-highlighting text)
    //   3. Convert to <div class="mermaid"> for Mermaid processing
    //   4. Call mermaid.render() per diagram with try/catch for D-01 fallback
    // =========================================================================
    function renderMermaidDiagrams() {
        if (!_mermaid) return;

        var mermaidBlocks = document.querySelectorAll('code.language-mermaid');
        mermaidBlocks.forEach(function(codeEl, index) {
            var pre = codeEl.parentElement;
            // codeEl.textContent gives raw text (hljs adds <span> nodes but textContent strips them)
            var source = codeEl.textContent || '';

            // Create a unique ID for mermaid.render()
            var id = 'mermaid-diagram-' + index + '-' + Date.now();

            // D-01: Use mermaid.render() per diagram with try/catch.
            // mermaid.run() does not reject per-diagram errors — it inserts an error SVG.
            // mermaid.render() returns a Promise; we catch per diagram to implement D-01.
            _mermaid.render(id, source).then(function(result) {
                // result.svg is the rendered SVG string
                var container = document.createElement('div');
                container.className = 'mermaid-diagram';
                container.innerHTML = result.svg;
                pre.parentNode.replaceChild(container, pre);
            }).catch(function() {
                // D-01 fallback: show syntax-highlighted code block instead of error SVG
                // The <pre><code class="language-mermaid"> is already in the DOM from hljs;
                // just leave it in place (no DOM change needed on failure).
                // hljs has already highlighted it; it will display as code.
            });
        });
    }

    // =========================================================================
    // Copy-to-clipboard button injection (XRND-04, D-02, D-03)
    // Called after renderMermaidDiagrams() in renderMarkdown().
    // Injects clipboard SVG button into each <pre><code> block.
    // Does NOT inject into mermaid diagram containers (they have no <code> child).
    // Silent copy per D-03 — no feedback animation.
    // navigator.clipboard.writeText() used (not deprecated execCommand).
    // =========================================================================
    function injectCopyButtons() {
        var blocks = document.querySelectorAll('pre > code');
        blocks.forEach(function(codeEl) {
            var pre = codeEl.parentElement;
            if (pre.querySelector('.copy-btn')) return;  // already injected (idempotent)

            var btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.setAttribute('aria-label', 'Copy code');
            btn.setAttribute('type', 'button');
            // GitHub clipboard SVG icon (D-02)
            btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">'
                + '<path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/>'
                + '<path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/>'
                + '</svg>';

            // D-03: silent copy — no feedback, no checkmark swap, no label change
            btn.addEventListener('click', function() {
                var text = codeEl.textContent || '';
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).catch(function() {
                        // Clipboard API failed silently per D-03
                    });
                }
                // No fallback to execCommand — deprecated and unreliable
            });

            pre.appendChild(btn);
        });
    }

    // =========================================================================
    // Render pipeline (REND-02, REND-03, REND-04, REND-06)
    // =========================================================================
    function renderMarkdown(markdown, filePath, customCss) {
        var preview     = document.getElementById('preview');
        var errorEl     = document.getElementById('error-state');
        var errorDetail = document.getElementById('error-detail');

        try {
            var stripped = stripFrontmatter(markdown);
            var rewritten = rewriteImagePaths(stripped);  // rewrite relative image paths (D-08, REND-05)
            var html = md.render(rewritten);
            hideIdle();
            preview.style.display = 'block';
            preview.innerHTML = html;
            errorEl.style.display = 'none';

            // Apply custom CSS after render (so it is in effect for the new content)
            setCustomCss(customCss || null);

            // Syntax highlighting: highlight all code blocks (REND-04)
            // hljs.highlightAll() is the correct call (not initHighlightingOnLoad)
            if (window.hljs) {
                window.hljs.highlightAll();
            }

            // Post-render: Mermaid diagrams and copy buttons (XRND-02, XRND-04)
            // Order matters: mermaid replaces some <pre> elements; copy buttons inject into remaining ones
            renderMermaidDiagrams();
            injectCopyButtons();
        } catch (err) {
            // Show error state per UI-SPEC Copywriting Contract
            hideIdle();
            preview.style.display = 'none';
            preview.innerHTML = '';
            errorEl.style.display = 'block';
            errorDetail.textContent = err && err.message ? err.message : String(err);
        }
    }

    // =========================================================================
    // Scroll sync (D-04, SCRL-01) — Plan 02-03 implementation
    // Finds the element with the highest data-line value that is <= target line.
    // Elements are in document order so we can stop at the first element > target.
    // Per UI-SPEC Interaction Contract D-04: smooth scroll, block start.
    // =========================================================================
    function scrollToLine(line) {
        var elements = document.querySelectorAll('[data-line]');
        if (!elements.length) return;

        var best = null;
        for (var i = 0; i < elements.length; i++) {
            var elLine = parseInt(elements[i].getAttribute('data-line'), 10);
            if (elLine <= line) {
                best = elements[i];
            } else {
                break;
            }
        }
        // Per UI-SPEC Interaction Contract D-04: smooth scroll, block start
        if (best) {
            best.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        // If no element found: no scroll, no error (per D-04 spec)
    }

    // =========================================================================
    // Export implementation (D-09, EXPT-01) — Plan 02-04
    // Collects CSS from <link> elements, inlines custom CSS, clones the preview
    // div, base64-encodes local images, serializes to a standalone HTML document,
    // and sends the result to C++ via postMessage({type:'exportReady', html:...}).
    // =========================================================================

    // Helper: convert a blob to a base64 data URI via FileReader
    function blobToDataUrl(blob) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function() { resolve(reader.result); };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    // Full export implementation (D-09, EXPT-01)
    async function exportHtml() {
        try {
            // Step 1: Collect CSS text from all <link rel="stylesheet"> elements
            var links = Array.from(document.querySelectorAll('link[rel=stylesheet]'));
            var cssTexts = await Promise.all(
                links.map(function(link) {
                    return fetch(link.href)
                        .then(function(r) { return r.text(); })
                        .catch(function() { return ''; });  // ignore fetch errors
                })
            );

            // Step 2: Collect custom CSS from inline <style id="custom-css"> if present
            var customStyle = document.getElementById('custom-css');
            var customCssText = customStyle ? customStyle.textContent : '';

            var inlinedCss = cssTexts.join('\n') + '\n' + customCssText;

            // Step 3: Clone preview div to avoid mutating live DOM
            var preview = document.getElementById('preview');
            var clone = preview.cloneNode(true);

            // Step 4: Convert local images to base64 data URIs in the clone
            var images = Array.from(clone.querySelectorAll('img'));
            await Promise.all(images.map(async function(img) {
                var originalSrc = img.getAttribute('src') || '';
                // Only process non-data-URI sources (data: URIs are already inline)
                if (originalSrc.startsWith('data:')) return;
                try {
                    var resp = await fetch(originalSrc);
                    if (!resp.ok) return;  // leave broken images as-is
                    var blob = await resp.blob();
                    img.src = await blobToDataUrl(blob);
                } catch (e) {
                    // Remote image or unresolvable — leave src as original URL
                }
            }));

            // Step 5: Build standalone HTML document
            // Include current theme class on body for correct rendering
            var isDark = document.body.getAttribute('data-theme') === 'dark';
            var bodyClass = 'markdown-body';
            var html = '<!DOCTYPE html>\n'
                + '<html lang="en">\n'
                + '<head>\n'
                + '<meta charset="UTF-8">\n'
                + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
                + '<title>Exported Markdown</title>\n'
                + '<style>\n' + inlinedCss + '\n</style>\n'
                + '</head>\n'
                + '<body class="' + bodyClass + '"' + (isDark ? ' data-theme="dark"' : '') + '>\n'
                + clone.outerHTML + '\n'
                + '</body>\n'
                + '</html>';

            // Step 6: Send to C++ for file I/O (D-10)
            window.chrome.webview.postMessage(
                JSON.stringify({ type: 'exportReady', html: html })
            );
        } catch (err) {
            // Export failed — do not crash; C++ will receive no exportReady message
            // and nothing will be written (silent failure in Phase 2)
            console.error('Export failed:', err);
        }
    }

    // =========================================================================
    // WebView2 message dispatcher
    // event.data is already parsed to a JS object (PostWebMessageAsJson)
    // =========================================================================
    window.chrome.webview.addEventListener('message', function(event) {
        var msg = event.data;
        if (!msg || !msg.type) return;

        switch (msg.type) {
            case 'render':
                renderMarkdown(
                    msg.markdown  || '',
                    msg.filePath  || '',
                    msg.customCss || null
                );
                break;
            case 'idle':
                showIdle();
                break;
            case 'theme':
                setTheme(!!msg.dark);
                break;
            case 'scroll':
                scrollToLine(msg.line || 0);
                break;
            case 'export':
                exportHtml();
                break;
            case 'zoom':
                // THME-04: apply zoom level to entire document body
                // msg.level is a float: 0.8 (80%) to 8.0 (800%)
                // CSS zoom property scales the rendering viewport in Chromium/WebView2
                document.body.style.zoom = String(msg.level);
                break;
        }
    });
    </script>
</body>
</html>
